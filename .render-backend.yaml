services:
  - type: web
    name: ai-sales-assistant-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      cd backend
      gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level debug app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FRONTEND_ORIGIN
        value: https://ai-sales-assistant-frontend.onrender.com
      - key: DATA_FILE
        value: DataFile_students_OPTIMIZED.xlsx
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false




services:
  - type: web
    name: ai-sales-assistant-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: ai-sales-assistant-frontend
          property: host
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: ai-sales-assistant-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-sales-assistant-backend
          property: host
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ai-sales-assistant-backend.onrender.com/api/*
    autoDeploy: true

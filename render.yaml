services:
  - type: web
    name: ai-sales-assistant-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DATA_FILE
        value: DataFile_students_OPTIMIZED.xlsx
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: ai-sales-assistant-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_API_BASE_URL
        value: https://ai-sales-assistant-backend.onrender.com
      - key: VITE_APP_PASSWORD
        sync: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ai-sales-assistant-backend.onrender.com/api/*
    autoDeploy: true
